name: Deploy to Cloud Run

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: supply-491510
      REGION: us-central1
      SERVICE_NAME: cathleen-qin-site
      IMAGE: us-central1-docker.pkg.dev/supply-491510/cathleen-qin-site/site:latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build
        run: docker build -t ${{ env.IMAGE }} .

      - run: docker push ${{ env.IMAGE }}

      - name: Deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --min-instances=0 --max-instances=3 \
            --memory=256Mi --cpu=1 \
            --concurrency=80 \
            --quiet

      - name: Verify
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "Deployed: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" "$URL"
        id: verify
