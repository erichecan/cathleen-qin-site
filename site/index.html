<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cathleen Qin</title>
<meta name="description" content="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231C3326'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23C7AC81' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap">

<style>
/* ===========================================================================
   设计变量 —— 想统一换配色/字体，改这里
   =========================================================================== */
:root{
  --green-900:#0F2417;
  --green-800:#1C3326;
  --green-700:#24402F;
  --footer-bg:#14261B;
  --gold:#A98B5C;
  --gold-soft:#C7AC81;
  --ink:#4A4A48;
  --ink-soft:#75736F;
  --bg:#F9F7F4;
  --bg-warm:#F4EFE9;
  --bg-hero:#F3EEE7;
  --bg-card:#F5F1EA;
  --bg-card-2:#EFE8DC;
  --line:#E5DFD5;
  --line-soft:#EDE8E0;
  --white:#FFF;

  --serif:'Cormorant Garamond','Times New Roman',Georgia,serif;
  --sans:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;

  --shell:1240px;
  --gut:clamp(20px,4vw,48px);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.85;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
ul{margin:0;padding:0;list-style:none}
h1,h2,h3,p{margin:0}
svg{display:block}

.shell{max-width:var(--shell);margin:0 auto;padding-inline:var(--gut);width:100%}

/* 通用文字件 */
.eyebrow{
  font-size:.7rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--green-800);
}
.h-serif{
  font-family:var(--serif);font-weight:600;color:var(--green-900);
  line-height:1.18;letter-spacing:.005em;
}
.rule{width:56px;height:1px;background:var(--gold);border:0;margin:0}
.lead{font-size:1.02rem;line-height:1.75;color:var(--ink)}
.muted{color:var(--ink-soft)}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.6em;
  font-family:var(--sans);font-size:.72rem;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;
  padding:15px 30px;border:1px solid transparent;cursor:pointer;
  transition:background .25s,color .25s,border-color .25s,transform .25s;
}
.btn--solid{background:var(--green-800);color:#F6F3EC}
.btn--solid:hover{background:var(--green-700);transform:translateY(-1px)}
.btn--ghost{background:transparent;color:var(--green-900);border-color:#CFC7BA}
.btn--ghost:hover{border-color:var(--green-800);background:rgba(28,51,38,.05)}
.btn--gold{background:var(--gold);color:#FFF9EE}
.btn--gold:hover{background:var(--gold-soft);transform:translateY(-1px)}
.btn--sm{padding:12px 24px;font-size:.68rem}

/* 文字箭头链接 */
.arrow-link{
  display:inline-flex;align-items:center;gap:.55em;
  font-size:.82rem;font-weight:500;color:var(--green-900);
}
.arrow-link svg{width:17px;height:17px;transition:transform .25s}
.arrow-link:hover svg{transform:translateX(5px)}

/* 图标 */
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.5;
    stroke-linecap:round;stroke-linejoin:round}

/* 入场动画（无 JS 时不生效，内容照常可见） */
.js .reveal{opacity:0;transform:translateY(20px)}
.js .reveal.in{opacity:1;transform:none;transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion:reduce){
  .js .reveal{opacity:1!important;transform:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

/* ===========================================================================
   顶部导航
   =========================================================================== */
.nav{
  position:sticky;top:0;z-index:50;background:var(--white);
  border-bottom:1px solid var(--line-soft);
}
.nav__inner{display:flex;align-items:center;justify-content:space-between;gap:24px;height:74px}
.nav__brand{font-family:var(--serif);font-size:1.5rem;font-weight:600;color:var(--green-900);
  letter-spacing:.01em;white-space:nowrap}
.nav__links{display:flex;gap:clamp(18px,2.6vw,40px)}
.nav__links a{
  font-size:.7rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);padding-bottom:5px;border-bottom:1.5px solid transparent;transition:.25s;
}
.nav__links a:hover{color:var(--green-900)}
.nav__links a.is-active{color:var(--green-900);border-bottom-color:var(--gold)}

/* ===========================================================================
   首屏
   =========================================================================== */
.hero{position:relative;overflow:hidden;background:linear-gradient(100deg,var(--bg-hero) 0%,#EFE9E0 60%,#E9E2D7 100%)}
.hero__media{
  position:absolute;inset:0 0 0 auto;width:46%;
  background-size:cover;background-position:center top;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 22%);
          mask-image:linear-gradient(to right,transparent 0,#000 22%);
}
.hero__inner{position:relative;z-index:1;padding-block:clamp(60px,8.6vw,118px)}
.hero__text{max-width:min(560px,56%)}
.hero__title{
  font-family:var(--serif);font-weight:600;color:var(--green-900);
  font-size:clamp(2.6rem,5.6vw,4.6rem);line-height:1.02;
  letter-spacing:.035em;text-transform:uppercase;
}
.hero__tagline{
  font-family:var(--serif);color:var(--gold);
  font-size:clamp(1.2rem,2.3vw,1.85rem);line-height:1.35;margin-top:14px;
}
.hero__lead{margin-top:20px;max-width:405px}
.hero__note{
  font-family:var(--serif);font-style:italic;font-size:.88rem;line-height:1.6;
  color:var(--ink);max-width:212px;margin-top:22px;
}
.hero__actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.hero .rule{margin-top:30px}

/* ===========================================================================
   大引言横幅
   =========================================================================== */
.quote{position:relative;overflow:hidden;background:var(--bg-warm)}
.quote__media{
  position:absolute;inset:0 0 0 auto;width:42%;
  background-size:cover;background-position:center 30%;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 30%);
          mask-image:linear-gradient(to right,transparent 0,#000 30%);
}
.quote__inner{position:relative;z-index:1;padding-block:clamp(20px,2.4vw,30px) clamp(24px,2.9vw,37px);display:flex;gap:26px}
.quote__mark{
  font-family:var(--serif);font-size:5.2rem;line-height:.62;color:var(--gold-soft);
  flex:none;
}
.quote__bar{width:1px;background:var(--gold);opacity:.5;flex:none;margin-top:6px}
.quote__body{max-width:min(455px,42%)}
.quote__text{
  font-family:var(--serif);font-size:clamp(1.5rem,2.45vw,1.95rem);
  line-height:1.22;color:var(--green-900);max-width:418px;
}
.quote__note{margin-top:26px;font-size:.88rem;line-height:1.7;max-width:452px}

/* ===========================================================================
   转折点
   =========================================================================== */
.turning{background:#FCFAF7;padding-block:clamp(18px,2.1vw,27px) clamp(12px,1.4vw,18px)}
.turning__grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,2fr);gap:clamp(28px,5vw,64px)}
.turning__aside .h-serif{font-size:clamp(1.6rem,2.6vw,2.15rem);margin-top:14px}
.turning__aside .rule{margin:18px 0 20px}
.turning__aside p{font-size:.88rem;line-height:1.9;max-width:270px}
.turning__list{border-left:1px solid var(--line);padding-left:clamp(24px,4vw,52px)}
.turning__item{
  display:flex;align-items:center;gap:22px;
  padding:14px 0;border-bottom:1px solid var(--line-soft);
}
.turning__item:last-child{border-bottom:0}
.turning__badge{
  flex:none;width:40px;height:40px;border-radius:50%;
  background:var(--green-800);color:#EFE9DD;
  display:grid;place-items:center;
}
.turning__badge .ic{width:25px;height:25px;stroke-width:1.45}
.turning__item p{font-family:var(--serif);font-size:1.18rem;color:var(--green-900);line-height:1.4}
.turning__foot{
  text-align:center;font-size:.82rem;color:var(--ink-soft);
  margin-top:clamp(20px,2.8vw,36px);
}

/* ===========================================================================
   内在旅程
   =========================================================================== */
.journey{padding-block:clamp(8px,1.5vw,18px)}
.journey__card{
  background:var(--bg-card);border:1px solid var(--line-soft);
  display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);
  gap:clamp(26px,4vw,54px);padding:clamp(22px,3vw,34px);align-items:center;
}
.journey__card img{width:100%;object-fit:cover;aspect-ratio:10/9}
.journey__title{font-size:clamp(1.5rem,2.6vw,2.06rem);margin-top:14px;max-width:404px}
.journey__body .rule{margin:20px 0 22px}
.journey__body p:not(.pullquote){font-size:.92rem;line-height:1.9;max-width:478px}
.pullquote{
  max-width:478px;
  font-family:var(--serif);font-style:italic;color:var(--gold);
  font-size:clamp(1.15rem,2.1vw,1.55rem);line-height:1.4;margin:18px 0;
}

/* ===========================================================================
   理念
   =========================================================================== */
.philosophy{padding-block:clamp(12px,1.4vw,18px) clamp(4px,.6vw,8px)}
.philosophy__grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,5vw,70px)}
.philosophy__title{font-size:clamp(1.5rem,2.5vw,2rem);margin-top:18px;max-width:382px}
.philosophy__left .rule{margin:14px 0 24px}
.philosophy__lines{max-width:378px}
.philosophy__lines li{font-size:.92rem;line-height:1.63}
.philosophy__right{border-left:1px solid var(--gold);padding-left:clamp(22px,3vw,34px)}
.philosophy__right .pullquote{margin-top:0}
.philosophy__right p:not(.pullquote){font-size:.9rem;line-height:1.9;max-width:400px}

/* ===========================================================================
   转变的三个阶段
   =========================================================================== */
.stages{padding-bottom:clamp(42px,5.2vw,66px)}
.stages__grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:clamp(10px,1.2vw,16px);
}
.stage{
  background:var(--bg-card-2);border:1px solid var(--line-soft);
  padding:19px 16px;text-align:center;
}
.stage__icon{width:66px;height:66px;margin:0 auto;color:var(--gold);
  fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.stage h3{
  font-family:var(--serif);font-weight:500;color:var(--green-900);
  font-size:1.28rem;letter-spacing:.06em;text-transform:uppercase;margin-top:26px;line-height:1.15;
}
.stage p{font-size:.84rem;line-height:1.75;margin:10px auto 0;max-width:190px;color:var(--ink)}

/* ===========================================================================
   写作 / 演讲
   =========================================================================== */
.dual{
  display:grid;grid-template-columns:45% 55%;gap:0;
  background:var(--bg-card);overflow:hidden;
}
.dual__card{position:relative;overflow:hidden;display:flex;min-height:clamp(320px,32.4vw,412px)}
.dual__card--r{border-left:1px solid var(--line)}
.dual__media{position:absolute;top:0;bottom:0;background-size:cover}
.dual__card--l .dual__media{left:0;width:36%;background-position:58% center;
  -webkit-mask-image:linear-gradient(to right,#000 52%,transparent 100%);
          mask-image:linear-gradient(to right,#000 52%,transparent 100%)}
.dual__card--r .dual__media{right:0;width:50%;background-position:50% 4%;mix-blend-mode:multiply;
  -webkit-mask-image:linear-gradient(to left,#000 62%,transparent 100%);
          mask-image:linear-gradient(to left,#000 62%,transparent 100%)}
.dual__body{
  position:relative;z-index:1;padding:clamp(20px,2.1vw,28px) clamp(26px,3vw,38px);
  display:flex;flex-direction:column;justify-content:flex-start;
}
.dual__card--l .dual__body{margin-left:35%;padding-right:clamp(20px,2.4vw,30px)}
.dual__card--r .dual__body{margin-right:45%;padding-left:clamp(38px,7.5%,76px)}
.dual__head h2{
  font-family:var(--sans);font-weight:600;color:var(--green-900);
  font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;
}
.dual__body>p{margin-top:12px;font-size:.8rem;line-height:1.75;max-width:300px}
.dual__topics{margin-top:14px}
.dual__topics li{
  position:relative;padding-left:16px;font-size:.8rem;line-height:1.7;margin-bottom:4px;
}
.dual__topics li::before{
  content:'';position:absolute;left:2px;top:.66em;
  width:5px;height:5px;border-radius:50%;background:var(--gold);
}
.dual__foot{margin-top:auto;padding-top:20px}
.dual__foot .btn{padding:12px 22px;font-size:.66rem}
.dual__foot .arrow-link{font-size:.78rem}

/* ===========================================================================
   旗下平台
   =========================================================================== */
.platforms{padding-block:clamp(48px,6vw,78px);text-align:center}
.platforms__title{
  font-family:var(--serif);font-weight:500;color:var(--green-900);
  font-size:clamp(1.45rem,2.7vw,2.1rem);line-height:1.35;
  max-width:640px;margin:16px auto 0;
}
.platforms__grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  margin-top:clamp(28px,4vw,46px);
}
.platform{padding:0 clamp(14px,2vw,28px);border-left:1px solid var(--line-soft)}
.platform:first-child{border-left:0}
.platform__logo{height:64px;display:grid;place-items:center;margin-bottom:20px}
.platform__logo img{max-height:64px;width:auto;object-fit:contain}
.platform p{font-size:.83rem;line-height:1.75}
.platform .arrow-link{margin-top:18px;font-size:.8rem}

/* ===========================================================================
   页脚
   =========================================================================== */
.foot{position:relative;overflow:hidden;background:var(--footer-bg);color:#EDE8DE;text-align:center}
.foot__leaf{position:absolute;right:2%;top:14%;width:clamp(90px,12vw,170px);
  color:var(--gold);opacity:.55;fill:none;stroke:currentColor;stroke-width:1.1;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.foot__inner{position:relative;z-index:1;padding-block:clamp(8px,1vw,13px) clamp(2px,.4vw,5px)}
.foot__quote{
  font-family:var(--serif);font-size:clamp(1.35rem,2.32vw,1.85rem);line-height:1.24;
  color:#F4F0E6;max-width:432px;margin:0 auto;
}
.foot .rule{margin:10px auto 0}
.foot .btn{margin-top:14px}
.foot__social{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:clamp(14px,2.6vw,30px);margin-top:14px;
}
.foot__social a{display:inline-flex;align-items:center;gap:9px;font-size:.8rem;color:#DCD6C9;transition:color .25s}
.foot__social a:hover{color:var(--gold-soft)}
.foot__social .ic{width:17px;height:17px}
.foot__social .sep{width:1px;height:15px;background:rgba(255,255,255,.2)}
.foot__copy{margin-top:8px;font-size:.72rem;color:rgba(237,232,222,.55)}

/* ===========================================================================
   Welcome 眼眉
   =========================================================================== */
.quote__body .eyebrow{display:block;margin-bottom:8px}

/* ===========================================================================
   我的工作
   =========================================================================== */
.mywork{padding-block:clamp(10px,1.2vw,15px) clamp(4px,.6vw,8px);background:var(--bg-warm);text-align:center}
.mywork__title{
  font-family:var(--serif);font-weight:600;color:var(--green-900);
  font-size:clamp(1.5rem,2.5vw,2rem);line-height:1.25;
  max-width:640px;margin:12px auto 0;
}
.mywork__sub{font-size:.86rem;line-height:1.75;color:var(--ink-soft);max-width:600px;margin:18px auto 0}
.mywork__grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:clamp(10px,1.2vw,16px);margin-top:12px;
}
.mywork__item{text-align:center;padding:14px 16px;border:1px solid var(--line-soft)}
.mywork__badge{
  display:inline-flex;width:46px;height:46px;border-radius:50%;
  background:var(--green-800);color:#EFE9DD;
  align-items:center;justify-content:center;margin-bottom:20px;
}
.mywork__badge .ic{width:24px;height:24px;stroke-width:1.45}
.mywork__item h3{
  font-family:var(--sans);font-weight:600;font-size:.7rem;
  letter-spacing:.16em;text-transform:uppercase;color:var(--green-900);margin-bottom:10px;
}
.mywork__item p{font-size:.84rem;line-height:1.75;margin-inline:auto;max-width:172px;color:var(--ink)}

/* ===========================================================================
   个人留言
   =========================================================================== */
.personal-note{
  position:relative;overflow:hidden;
  padding-block:clamp(30px,3.6vw,46px) clamp(16px,2vw,26px);
}
.personal-note__media{
  position:absolute;inset:0 0 0 auto;width:50%;
  background-size:cover;background-position:center 65%;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 26%);
          mask-image:linear-gradient(to right,transparent 0,#000 26%);
}
.personal-note__grid{position:relative;z-index:1}
.personal-note__body{max-width:min(560px,52%)}
.personal-note__body .eyebrow{display:block;margin-bottom:24px}
.personal-note__title{font-size:clamp(1.5rem,2.4vw,1.9rem);margin-top:0}
.personal-note__body .rule{margin:12px 0 18px}
.personal-note__body>p{font-size:.82rem;line-height:1.68;max-width:535px}
.personal-note__questions{
  margin-top:34px;display:flex;flex-direction:row;flex-wrap:wrap;
  gap:clamp(14px,2vw,26px);
}
.personal-note__q{
  display:flex;align-items:flex-start;gap:10px;flex:1 1 0;min-width:150px;
  font-family:var(--serif);font-style:italic;
  font-size:.82rem;color:var(--ink-soft);line-height:1.4;
}
.personal-note__q .ic{flex:none;width:26px;height:26px;color:var(--gold);stroke-width:1.3}

/* 页脚补充 */
.foot__sub{font-size:.86rem;line-height:1.72;color:rgba(237,232,222,.7);max-width:576px;margin:12px auto 0}
.foot__tagline{margin-top:22px;font-size:.8rem;color:rgba(237,232,222,.6)}

/* ===========================================================================
   响应式
   =========================================================================== */
@media (max-width:1024px){
  .turning__grid{grid-template-columns:1fr;gap:28px}
  .turning__list{border-left:0;padding-left:0}
  .turning__aside p{max-width:none}
  .philosophy__grid{grid-template-columns:1fr;gap:30px}
  .philosophy__lines,.philosophy__right p:not(.pullquote){max-width:none}
  .mywork__grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .journey__title,.journey__body p:not(.pullquote),.pullquote{max-width:none}
  .quote__body{max-width:min(455px,58%)}
}
@media (max-width:900px){
  .nav__links{display:none}
  .personal-note{padding-block:clamp(26px,4vw,40px) 0}
  .personal-note__body{max-width:none}
  .personal-note__body>p,.foot__quote,.quote__text,.quote__note,.hero__note{max-width:none}
  .personal-note__questions{gap:14px}
  .personal-note__media{
    position:relative;inset:auto;width:100%;height:min(56vw,300px);margin-bottom:26px;
    -webkit-mask-image:none;mask-image:none}
  .quote__body{max-width:none}
  .hero__media{position:relative;inset:auto;width:100%;height:min(60vw,380px);
    -webkit-mask-image:none;mask-image:none;background-position:center 22%}
  .hero__text{max-width:none}
  .hero__lead,.hero__note{max-width:none}
  .quote__media{position:relative;inset:auto;width:100%;height:min(48vw,240px);
    -webkit-mask-image:none;mask-image:none}
  .quote__inner{gap:16px}
  .quote__body{max-width:none}
  .journey__card{grid-template-columns:1fr}
  .stages__grid{grid-template-columns:1fr}
  .dual{grid-template-columns:1fr}
  .dual__card{flex-direction:column;min-height:0}
  .dual__card--r{border-left:0;border-top:1px solid var(--line)}
  .dual__card--l .dual__media,.dual__card--r .dual__media{
    position:relative;top:auto;bottom:auto;left:auto;right:auto;
    width:100%;height:170px;background-position:center;
    -webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 55%,transparent 100%)}
  .dual__card--l .dual__body,.dual__card--r .dual__body{margin:0}
  .dual__body>p{max-width:none}
}
@media (max-width:560px){
  .nav__inner{height:62px}
  .nav__brand{font-size:1.2rem}
  .nav__inner>.btn{padding:10px 14px;font-size:.58rem;letter-spacing:.09em}
  .quote__mark{font-size:3.4rem}
  .mywork__grid{grid-template-columns:1fr}
  .stage p,.mywork__item p{max-width:none}
  .turning__item{align-items:flex-start;gap:16px}
  .hero__actions{gap:10px}
  .hero__actions .btn,.dual__foot .btn,.foot .btn{width:100%}
}
@media (max-width:380px){
  .nav__inner>.btn{display:none}
}
</style>
</head>
<body>

<!-- ===========================================================================
     图标库 —— 想换图标就改这里的 <symbol> 路径，id 与 content.js 里的 icon 值对应
     =========================================================================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="icon-leaf" viewBox="0 0 24 24">

      <path d="M12 11c-.5-4.4 1.6-8 6-9.5 1.1 5-1.3 8.9-6 9.5Z"/>

    <symbol id="icon-lotus" viewBox="0 0 24 24">

<!-- ============================ 顶部导航 ============================ -->
<header class="nav">
  <div class="nav__inner shell">
    <a class="nav__brand" href="#home" data-t="nav.brand"></a>
    <nav class="nav__links" data-list="nav.links">
      <template><a data-link="."></a></template>
    </nav>
    <a class="btn btn--solid btn--sm" data-link="nav.cta"></a>
  </div>
</header>

<main>

  <!-- ============================ 首屏 ============================ -->
  <section class="hero" id="home">
    <div class="hero__media" data-bg="hero.image"></div>
    <div class="hero__inner shell">
      <div class="hero__text">
        <h1 class="hero__title reveal" data-t="hero.title"></h1>
        <p class="hero__tagline reveal" data-t="hero.tagline"></p>
        <p class="hero__lead lead reveal" data-t="hero.lead"></p>
        <hr class="rule reveal">
        <p class="hero__note reveal" data-t="hero.note"></p>
        <div class="hero__actions reveal">
          <a class="btn btn--solid" data-link="hero.primaryCta"></a>
          <a class="btn btn--ghost" data-link="hero.secondaryCta"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================ 大引言 ============================ -->
  <section class="quote">
    <div class="quote__media" data-bg="quote.image"></div>
    <div class="quote__inner shell">
      <span class="quote__mark" aria-hidden="true">&ldquo;</span>
      <div class="quote__bar" aria-hidden="true"></div>
      <blockquote class="quote__body reveal">
        <span class="eyebrow" data-t="quote.eyebrow"></span>
        <p class="quote__text" data-t="quote.text"></p>
        <p class="quote__note" data-t="quote.body"></p>
      </blockquote>
    </div>
  </section>

  <!-- ============================ 转折点 ============================ -->
  <section class="turning" id="about">
    <div class="shell">
      <div class="turning__grid">
        <div class="turning__aside reveal">
          <span class="eyebrow" data-t="turningPoint.eyebrow"></span>
          <h2 class="h-serif" data-t="turningPoint.title"></h2>
          <hr class="rule">
          <p data-t="turningPoint.body"></p>
        </div>
        <ul class="turning__list" data-list="turningPoint.items">
          <template>
            <li class="turning__item reveal">
              <span class="turning__badge"><svg class="ic" data-icon="icon"><use></use></svg></span>
              <p data-t="text"></p>
            </li>
          </template>
        </ul>
      </div>
      <p class="turning__foot reveal" data-t="turningPoint.footnote"></p>
    </div>
  </section>

  <!-- ============================ 内在旅程 ============================ -->
  <section class="journey">
    <div class="shell">
      <div class="journey__card reveal">
        <img data-img="innerJourney.image" alt="">
        <div class="journey__body">
          <span class="eyebrow" data-t="innerJourney.eyebrow"></span>
          <h2 class="h-serif journey__title" data-t="innerJourney.title"></h2>
          <hr class="rule">
          <p data-t="innerJourney.intro"></p>
          <p class="pullquote" data-quote="innerJourney.pullquote"></p>
          <p data-t="innerJourney.body"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================ 理念 ============================ -->
  <section class="philosophy">
    <div class="shell">
      <div class="philosophy__grid">
        <div class="philosophy__left reveal">
          <span class="eyebrow" data-t="philosophy.eyebrow"></span>
          <h2 class="h-serif philosophy__title" data-t="philosophy.title"></h2>
          <hr class="rule">
          <ul class="philosophy__lines" data-list="philosophy.lines">
            <template><li data-t="."></li></template>
          </ul>
        </div>
        <div class="philosophy__right reveal">
          <p class="pullquote" data-quote="philosophy.pullquote"></p>
          <p data-t="philosophy.body"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================ 三个阶段 ============================ -->
  <section class="stages">
    <div class="shell">
      <div class="reveal">
        <div class="stages__grid" data-list="stages.items">
          <template>
            <article class="stage">
              <svg class="stage__icon" data-icon="icon"><use></use></svg>
              <h3 data-t="title"></h3>
              <p data-t="text"></p>
            </article>
          </template>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================ 写作 / 演讲 ============================ -->
  <section class="shell" style="padding-bottom:0">
    <div class="dual">

      <article class="dual__card dual__card--l reveal" id="writing">
        <div class="dual__media" data-bg="writing.image"></div>
        <div class="dual__body">
          <div class="dual__head"><h2 data-t="writing.title"></h2></div>
          <p data-t="writing.body"></p>
          <ul class="dual__topics" data-list="writing.topics">
            <template><li data-t="."></li></template>
          </ul>
          <div class="dual__foot">
            <a class="arrow-link" data-link="writing.link">
              <span></span><svg class="ic"><use href="#icon-arrow"></use></svg>
            </a>
          </div>
        </div>
      </article>

      <article class="dual__card dual__card--r reveal" id="speaking">
        <div class="dual__media" data-bg="speaking.image"></div>
        <div class="dual__body">
          <div class="dual__head"><h2 data-t="speaking.title"></h2></div>
          <p data-t="speaking.body"></p>
          <ul class="dual__topics" data-list="speaking.topics">
            <template><li data-t="."></li></template>
          </ul>
          <div class="dual__foot">
            <a class="btn btn--solid" data-link="speaking.cta"></a>
          </div>
        </div>
      </article>

    </div>
  </section>

  <!-- ============================ 我的工作 ============================ -->
  <section class="mywork">
    <div class="shell">
      <span class="eyebrow reveal" data-t="myWork.eyebrow"></span>
      <h2 class="mywork__title reveal" data-t="myWork.title"></h2>
      <p class="mywork__sub reveal" data-t="myWork.subtitle"></p>
      <div class="mywork__grid" data-list="myWork.items">
        <template>
          <article class="mywork__item reveal">
            <div class="mywork__badge"><svg class="ic" data-icon="icon"><use></use></svg></div>
            <h3 data-t="title"></h3>
            <p data-t="text"></p>
          </article>
        </template>
      </div>
    </div>
  </section>

  <!-- ============================ 个人留言 ============================ -->
  <section class="personal-note">
    <div class="personal-note__media" data-bg="personalNote.image"></div>
    <div class="shell">
      <div class="personal-note__grid reveal">
        <div class="personal-note__body">
          <span class="eyebrow" data-t="personalNote.eyebrow"></span>
          <h2 class="h-serif personal-note__title" data-t="personalNote.title"></h2>
          <hr class="rule">
          <p data-t="personalNote.body"></p>
          <ul class="personal-note__questions" data-list="personalNote.questions">
            <template>
              <li class="personal-note__q">
                <svg class="ic" data-icon="icon"><use></use></svg>
                <span data-t="text"></span>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- ============================ 页脚 ============================ -->
<footer class="foot" id="contact">
  <svg class="foot__leaf" viewBox="0 0 120 220" aria-hidden="true">
    <path d="M60 220V38"/>
    <path d="M60 40c-2-16 6-30 22-38 5 18-4 33-22 38Z"/>
    <path d="M60 78c-16 1-29-7-35-22 17-4 32 4 35 22Z"/>
    <path d="M60 112c15 1 28-7 34-22-17-4-31 4-34 22Z"/>
  </svg>
  <div class="foot__inner shell">
    <p class="foot__quote reveal" data-t="footer.quote"></p>
    <hr class="rule reveal">
    <p class="foot__sub reveal" data-t="footer.sub"></p>
    <a class="btn btn--gold reveal" data-link="footer.cta"></a>
    <div class="foot__social reveal" data-list="footer.social" data-sep="1">
      <template>
        <a data-link="." data-keep-text="1">
          <svg class="ic" data-icon="icon"><use></use></svg><span data-t="label"></span>
        </a>
      </template>
    </div>
    <p class="foot__tagline" data-t="footer.tagline"></p>
    <p class="foot__copy" data-t="footer.copyright"></p>
  </div>
</footer>

<script src="content.js"></script>
<script>
/* ===========================================================================
   渲染器 —— 把 content.js 的内容填进上面的结构。改文案不需要动这里。
   =========================================================================== */
(function () {
  document.documentElement.classList.add('js');

  var C = window.CONTENT;
  if (!C) { console.error('content.js 未加载：请确认它和 index.html 在同一目录'); return; }

  function get(ctx, path) {
    if (path === '.') return ctx;
    return path.split('.').reduce(function (o, k) {
      return (o === null || o === undefined) ? undefined : o[k];
    }, ctx);
  }

  function bind(root, ctx) {
    root.querySelectorAll('[data-t]').forEach(function (el) {
      var v = get(ctx, el.dataset.t);
      if (typeof v === 'string') el.textContent = v;
    });

    root.querySelectorAll('[data-quote]').forEach(function (el) {
      var v = get(ctx, el.dataset.quote);
      if (typeof v === 'string') el.textContent = '“' + v + '”';
    });

    root.querySelectorAll('[data-img]').forEach(function (el) {
      var v = get(ctx, el.dataset.img);
      if (v && v.src) { el.src = v.src; el.alt = v.alt || ''; }
    });

    root.querySelectorAll('[data-bg]').forEach(function (el) {
      var v = get(ctx, el.dataset.bg);
      if (v && v.src) {
        el.style.backgroundImage = 'url("' + v.src + '")';
        el.setAttribute('role', 'img');
        if (v.alt) el.setAttribute('aria-label', v.alt);
      }
    });

    root.querySelectorAll('[data-icon]').forEach(function (el) {
      var name = get(ctx, el.dataset.icon);
      var use = el.querySelector('use');
      if (name && use) use.setAttribute('href', '#icon-' + name);
    });

    root.querySelectorAll('[data-link]').forEach(function (el) {
      var v = get(ctx, el.dataset.link);
      if (!v) return;
      if (v.href) el.setAttribute('href', v.href);
      if (!v.label || el.hasAttribute('data-keep-text')) return;
      var slot = el.querySelector('span');
      if (slot) slot.textContent = v.label;
      else el.textContent = v.label;
    });
  }

  /* 先展开所有列表，再填充页面其余部分 */
  document.querySelectorAll('[data-list]').forEach(function (host) {
    var tpl = host.querySelector('template');
    var items = get(C, host.dataset.list);
    if (!tpl || !Array.isArray(items)) return;
    var withSep = host.hasAttribute('data-sep');
    var frag = document.createDocumentFragment();
    items.forEach(function (item, i) {
      if (withSep && i > 0) {
        var sep = document.createElement('span');
        sep.className = 'sep';
        frag.appendChild(sep);
      }
      var node = tpl.content.cloneNode(true);
      var wrap = document.createElement('div');
      wrap.appendChild(node);
      bind(wrap, item);
      while (wrap.firstChild) frag.appendChild(wrap.firstChild);
    });
    tpl.remove();
    host.appendChild(frag);
  });

  bind(document, C);

  if (C.meta) {
    if (C.meta.title) document.title = C.meta.title;
    var d = document.querySelector('meta[name="description"]');
    if (d && C.meta.description) d.setAttribute('content', C.meta.description);
  }

  /* 滚动入场 */
  var targets = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    targets.forEach(function (el) { el.classList.add('in'); });
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.style.transitionDelay = (e.target.dataset.d || 0) + 'ms';
        e.target.classList.add('in');
        io.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
    targets.forEach(function (el, i) {
      var group = el.parentElement;
      var sibs = group ? Array.prototype.indexOf.call(group.children, el) : 0;
      el.dataset.d = Math.min(sibs, 5) * 70;
      io.observe(el);
    });
  }

  /* 导航高亮 */
  var navLinks = Array.prototype.filter.call(
    document.querySelectorAll('.nav__links a'),
    function (a) { return (a.getAttribute('href') || '').startsWith('#'); }
  );
  var sections = navLinks
    .map(function (a) { return document.querySelector(a.getAttribute('href')); })
    .filter(Boolean);

  if (sections.length && 'IntersectionObserver' in window) {
    var spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        navLinks.forEach(function (a) {
          a.classList.toggle('is-active', a.getAttribute('href') === '#' + e.target.id);
        });
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    sections.forEach(function (s) { spy.observe(s); });
  }
})();
</script>
</body>
</html>
